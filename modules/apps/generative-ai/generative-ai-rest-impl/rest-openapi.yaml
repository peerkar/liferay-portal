components:
    schemas:
        GenerativeAIRequest:
            properties:
                input:
                    type: object
            type: object
        GenerativeAIResponse:
            properties:
                debugInfo:
                    type: object
                output:
                    type: object
                took:
                    type: string
        TaskDefinition:
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                configuration:
                    type: object
                createDate:
                    format: date
                    type: string
                description:
                    type: string
                description_i18n:
                    additionalProperties:
                        type: string
                    type: object
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                id:
                    format: int64
                    type: integer
                modifiedDate:
                    format: date
                    type: string
                readOnly:
                    type: boolean
                schemaVersion:
                    type: string
                title:
                    type: string
                title_i18n:
                    additionalProperties:
                        type: string
                    type: object
                userName:
                    # TODO: is needed?
                    type: string
                version:
                    type: string
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.generative.ai.rest.client', and version '1.0.0'."
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/generate/{externalReferenceCode}":
        post:
            description:
                "TBD"
            operationId: postGenerateExternalReferenceCode
            parameters:
                - in: path
                  description:
                      The chat configuration external reference code.
                  name: externalReferenceCode
                  required: true
                  schema:
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/GenerativeAIRequest"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/GenerativeAIRequest"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GenerativeAIResponse"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/GenerativeAIResponse"
            tags: ["GenerativeAIResponse"]
    /task-definitions:
        get:
            operationId: getTaskDefinitionsPage
            parameters:
                - in: query
                  name: filter
                  schema:
                      type: string
                - in: query
                  name: page
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  schema:
                      type: integer
                - in: query
                  name: search
                  schema:
                      type: string
                - in: query
                  name: sort
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/TaskDefinition"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/TaskDefinition"
                                type: array
            tags: ["TaskDefinition"]
        post:
            operationId: postTaskDefinition
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaskDefinition"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/TaskDefinition"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
            tags: ["TaskDefinition"]
    /task-definitions/by-external-reference-code/{externalReferenceCode}:
        get:
            operationId: getTaskDefinitionByExternalReferenceCode
            parameters:
                - in: path
                  name: externalReferenceCode
                  required: true
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
            tags: ["TaskDefinition"]
        put:
            operationId: putTaskDefinitionByExternalReferenceCode
            parameters:
                - in: path
                  name: externalReferenceCode
                  required: true
                  schema:
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaskDefinition"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/TaskDefinition"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
            tags: ["TaskDefinition"]
    /task-definitions/by-external-reference-code/{externalReferenceCode}/clear:
        post:
            operationId: postTaskDefinitionByExternalReferenceCodeClear
            parameters:
                - in: path
                  name: externalReferenceCode
                  required: true
                  schema:
                      type: string                            
            responses:
                204:
                    description: No Content
                    content: {}
            tags: ["TaskDefinition"]
    /task-definitions/validate:
        post:
            operationId: postTaskDefinitionValidate
            requestBody:
                content:
                    application/json:
                        schema:
                            type: string
                    application/xml:
                        schema:
                            type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
            tags: ["TaskDefinition"]
    /task-definitions/{taskDefinitionId}:
        delete:
            operationId: deleteTaskDefinition
            parameters:
                - in: path
                  name: taskDefinitionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["TaskDefinition"]
        get:
            operationId: getTaskDefinition
            parameters:
                - in: path
                  name: taskDefinitionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
            tags: ["TaskDefinition"]
        patch:
            operationId: patchTaskDefinition
            parameters:
                - in: path
                  name: taskDefinitionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaskDefinition"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/TaskDefinition"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
            tags: ["TaskDefinition"]
        put:
            operationId: putTaskDefinition
            parameters:
                - in: path
                  name: taskDefinitionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaskDefinition"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/TaskDefinition"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
            tags: ["TaskDefinition"]
    /task-definitions/{taskDefinitionId}/copy:
        post:
            operationId: postTaskDefinitionCopy
            parameters:
                - in: path
                  name: taskDefinitionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/TaskDefinition"
            tags: ["TaskDefinition"]
    /task-definitions/{taskDefinitionId}/export:
        get:
            operationId: getTaskDefinitionExport
            parameters:
                - in: path
                  name: taskDefinitionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                format: binary
                                type: string
                        application/xml:
                            schema:
                                format: binary
                                type: string
                    headers:
                        Content-Disposition:
                            schema:
                                type: string
            tags: ["TaskDefinition"]